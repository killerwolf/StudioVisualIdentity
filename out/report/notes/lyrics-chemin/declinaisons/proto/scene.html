<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lyrics chemin — déclinaisons (maquette d'images fixes)</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  // ?d=magellan | quatre-quarts | cargo   &t=<s> (image affichée à l'ouverture)   &guides=1   &cam=x,y,zoom,angle°   &data=… (cargo : autres mots, voir cargo.js)
  import { lancer } from './core.js';
  const d = new URLSearchParams(location.search).get('d') || 'magellan';
  window.ready = import(`./${d}.js`).then(async m => { if (m.avant) await m.avant(); return lancer(m); });
</script>
