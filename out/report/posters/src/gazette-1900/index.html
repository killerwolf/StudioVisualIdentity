<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Affiche — Gazette 1900</title>
<!-- Direction gazette-1900 : une de journal "édition spéciale", gravure procédurale en hachures (canvas),
     manchette Playfair 900, tampon rouge (GSAP timeline seekée à t), grain/vignette en post (post.py, OpenCV). -->
<style>
:root{--bg:#E9E1CF;--surface:#D8CDB4;--red:#B3261E;--ink:#1E1B18}
html,body{margin:0;background:var(--bg);width:1080px;height:1920px;overflow:hidden}
#page{position:absolute;inset:0;background:var(--bg);color:var(--ink)}
.border{position:absolute;inset:26px;border:3px solid var(--ink);outline:1px solid var(--ink);outline-offset:-12px}
#mast{position:absolute;left:60px;width:900px;top:228px;text-align:center}
#mast .name{font:900 104px/1 'Playfair Display';letter-spacing:2px}
#mast .rule{height:0;border-top:5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding-top:5px;margin:12px 0 0}
#mast .meta{display:flex;justify-content:space-between;font:500 30px/1 'IBM Plex Mono';padding:12px 4px 12px;border-bottom:1.5px solid var(--ink)}
#kicker{position:absolute;left:60px;width:900px;top:452px;text-align:center;font:400 72px/1 'DM Serif Display';color:var(--red)}
#head{position:absolute;left:60px;width:900px;top:530px;text-align:center;transform-origin:50% 50%}
#head .big{font:900 330px/0.86 'Playfair Display';letter-spacing:-8px}
#head .sub{font:900 112px/1 'Playfair Display';letter-spacing:1px;margin-top:6px}
#plate{position:absolute;left:60px;top:930px;width:900px;height:430px;border:3px solid var(--ink)}
#plate canvas{display:block}
#cap{position:absolute;left:60px;width:900px;top:1372px;text-align:center;font:italic 400 40px/1.1 'DM Serif Display'}
#dep{position:absolute;left:60px;width:900px;top:1432px;border-top:5px solid var(--ink);padding-top:22px;font:500 54px/1.18 'IBM Plex Mono'}
#dep b{color:var(--red);font-weight:700}
#stamp{position:absolute;left:600px;top:400px;width:330px;padding:14px 0;text-align:center;border:7px solid var(--red);color:var(--red);
  font:400 52px/1.05 'DM Serif Display';text-transform:uppercase;letter-spacing:3px;transform-origin:50% 50%;mix-blend-mode:multiply;outline:2px solid var(--red);outline-offset:-16px}
#stamp small{display:block;font:600 26px/1.2 'IBM Plex Mono';letter-spacing:2px}
</style></head><body>
<div id="page">
  <div class="border"></div>
  <div id="mast">
    <div class="name">LE PETIT CRIEUR</div>
    <div class="rule"></div>
    <div class="meta"><span>N° 1789</span><span>MARDI 14 JUILLET</span><span>5 CENT.</span></div>
  </div>
  <div id="kicker">Paris s'est soulevé !</div>
  <div id="head"><div class="big">1789</div><div class="sub">EN 20 SECONDES</div></div>
  <div id="plate"><canvas id="cv" width="894" height="424"></canvas></div>
  <div id="cap">La forteresse de la Bastille cède sous l'assaut.</div>
  <div id="dep"><b>DÉPÊCHE —</b> le peuple prend la Bastille, le roi vacille.<span id="caret">▌</span></div>
  <div id="stamp"><small>— supplément —</small>Édition<br>spéciale</div>
</div>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script type="module">
import * as S from '/out/tools/lib/svi.js';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const Wc = cv.width, Hc = cv.height, R = S.rng(1789), INK = '#1E1B18';

// ---- gravure procédurale : ciel hachuré, fumée, forteresse à tours cylindriques, foule ----
function engraving() {
  g.fillStyle = '#E4DAC4'; g.fillRect(0, 0, Wc, Hc);
  g.strokeStyle = INK; g.lineCap = 'round';
  // ciel : lignes horizontales dont l'épaisseur suit un bruit (nuages / fumée plus clairs)
  const smoke = (x, y) => {
    let s = 0;
    for (const [cx, cy, r] of [[250, 120, 150], [420, 70, 120], [690, 110, 170], [560, 40, 90]])
      s += Math.max(0, 1 - Math.hypot((x - cx) / 1.4, y - cy) / r);
    return S.clamp(s + (S.noise2(x / 60, y / 40) - .5) * .5);
  };
  for (let y = 4; y < 300; y += 7) {
    g.beginPath();
    for (let x = 0; x <= Wc; x += 6) {
      const k = smoke(x, y); const w = S.lerp(2.6, 0.0, k) * (0.55 + y / 600);
      g.lineWidth = Math.max(.05, w);
      if (w < .25) { g.stroke(); g.beginPath(); g.moveTo(x, y); continue; }
      x === 0 ? g.moveTo(x, y + Math.sin(x / 40) * .6) : g.lineTo(x, y + Math.sin(x / 40) * .6);
    }
    g.stroke();
  }
  // contours de fumée (volutes)
  g.lineWidth = 1.6;
  for (const [cx, cy, r] of [[250, 120, 70], [330, 90, 55], [420, 70, 60], [640, 100, 80], [730, 130, 60], [560, 50, 45]]) {
    g.beginPath(); g.arc(cx, cy, r, Math.PI * 1.05, Math.PI * 2.05); g.stroke();
  }
  // forteresse
  const base = 330;
  const towers = [[70, 92, 230], [230, 100, 250], [430, 112, 270], [620, 100, 245], [780, 92, 225]];
  // courtines entre les tours
  g.fillStyle = '#E4DAC4';
  g.fillRect(70, base - 170, 760, 170);
  for (let x = 70; x < 830; x += 5) { g.lineWidth = 1.1 + (S.noise2(x / 30, 3) - .5); g.beginPath(); g.moveTo(x, base - 165); g.lineTo(x, base); g.stroke(); }
  g.lineWidth = 3; g.strokeRect(70, base - 170, 760, 170);
  for (const [cx, w, h] of towers) {
    const x0 = cx - w / 2, top = base - h;
    g.fillStyle = '#E4DAC4'; g.fillRect(x0, top, w, h);
    // hachures verticales ombrées comme un cylindre (lumière à gauche)
    for (let x = x0 + 2; x < x0 + w; x += 4) {
      const u = (x - x0) / w; const shade = Math.pow(S.clamp(u * 1.2 - .1), 1.4);
      g.lineWidth = S.lerp(.4, 3.4, shade);
      g.beginPath(); g.moveTo(x, top + 14); g.lineTo(x, base); g.stroke();
    }
    // assises de pierre
    g.lineWidth = .9;
    for (let y = top + 30; y < base; y += 22) { g.beginPath(); g.moveTo(x0, y); g.quadraticCurveTo(cx, y + 6, x0 + w, y); g.stroke(); }
    // créneaux
    g.fillStyle = INK;
    for (let i = 0; i < 5; i++) { const cw = w / 9; g.fillRect(x0 + i * 2 * cw, top - 14, cw, 16); }
    g.lineWidth = 3; g.strokeRect(x0, top, w, h);
    // meurtrières
    g.fillRect(cx - 4, top + 60, 8, 26); g.fillRect(cx - 4, top + 130, 8, 26);
  }
  // drapeau
  g.lineWidth = 3; g.beginPath(); g.moveTo(430, base - 284); g.lineTo(430, base - 360); g.stroke();
  g.fillStyle = '#B3261E'; g.beginPath(); g.moveTo(432, base - 360); g.quadraticCurveTo(470, base - 368, 500, base - 350); g.quadraticCurveTo(470, base - 338, 432, base - 332); g.fill();
  // sol + foule (silhouettes en encre pleine, piques)
  g.fillStyle = INK; g.fillRect(0, base, Wc, Hc - base);
  for (let i = 0; i < 140; i++) {
    const x = R() * Wc, y = base + 6 + R() * 30, r = 9 + R() * 7;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    if (R() < .25) { g.lineWidth = 2.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 26, y - 70 - R() * 40); g.stroke(); }
  }
  // lumière du sol : hachures claires
  g.strokeStyle = '#E4DAC4'; g.lineWidth = 1.2;
  for (let y = base + 54; y < Hc; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(Wc, y + 3); g.stroke(); }
}

// ---- timeline GSAP (seekée, déterministe) : tampon qui claque, manchette qui tourne puis se pose ----
const tl = gsap.timeline({ paused: true });
tl.fromTo('#head', { rotation: -720, scale: 0.05 }, { rotation: -2, scale: 1, duration: 1.1, ease: 'power3.out' }, 0.1)
  .fromTo('#stamp', { scale: 2.6, rotation: 4, opacity: 0 }, { scale: 1, rotation: -9, opacity: 1, duration: .18, ease: 'power4.in' }, 1.35)
  .fromTo('#kicker', { opacity: 0 }, { opacity: 1, duration: .01 }, 1.2)
  .fromTo('#dep', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: .6, ease: 'steps(24)' }, 1.3);

S.installContract({
  duration: 6,
  ready: S.loadFonts([
    { family: 'Playfair Display', pkg: 'playfair-display', weight: 900 },
    { family: 'DM Serif Display', pkg: 'dm-serif-display', weight: 400 },
    { family: 'DM Serif Display', pkg: 'dm-serif-display', weight: 400, style: 'italic' },
    { family: 'IBM Plex Mono', pkg: 'ibm-plex-mono', weight: 500 },
    { family: 'IBM Plex Mono', pkg: 'ibm-plex-mono', weight: 600 },
    { family: 'IBM Plex Mono', pkg: 'ibm-plex-mono', weight: 700 },
  ]).then(engraving),
  renderAt: t => { tl.seek(t, false); document.getElementById('caret').style.opacity = (Math.floor(t * 2) % 2) ? 0 : 1; },
});
</script></body></html>
