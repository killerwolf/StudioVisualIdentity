<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>bench GSAP cosmos-doc</title>
<!-- Mesure du coût GSAP seul : reprend le DOM texte + la timeline de index.html (sans three.js), seek de 450 frames
     avec layout forcé, résultat affiché à l'écran (lire via render.mjs --stills 0). -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body style="margin:0;background:#000">
<div id="res" style="position:fixed;left:60px;top:900px;font:64px monospace;color:#fff;z-index:9;white-space:pre"></div>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script type="module">
import { S, FONTS, reveal, hide } from './cosmos.js';
const src = await (await fetch('./index.html')).text();
const doc = new DOMParser().parseFromString(src, 'text/html');
document.head.appendChild(doc.querySelector('style'));
doc.querySelectorAll('body > div').forEach(d => document.body.appendChild(d));
await S.loadFonts(FONTS);
const tl = gsap.timeline({ paused: true });
reveal(tl, '#tag', 0.0, { dur: 1.2, from: '0.7em', to: '0.3em' });
reveal(tl, '#title', 0.05, { dur: 0.9, from: '0.22em', to: '0.01em' });
tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: 'sine.inOut', immediateRender: false }, 0.7);
hide(tl, '#tag', 3.5); hide(tl, '#title', 3.55); hide(tl, '#rule', 3.55);
reveal(tl, '#mName', 4.55, { dur: 1.2 }); reveal(tl, '#mSub', 4.9, { dur: 1.0, from: '.08em', to: '0em' });
reveal(tl, '#mDay', 5.5, { dur: 1.0 }); reveal(tl, '#mNight', 6.0, { dur: 1.0 });
reveal(tl, '#mAtm', 6.5, { dur: 1.0 }); reveal(tl, '#mAtm2', 6.8, { dur: .9, from: '.08em', to: '0em' });
['#mName', '#mSub', '#mDay', '#mNight', '#mAtm', '#mAtm2'].forEach(s => hide(tl, s, 7.55, .5));
reveal(tl, '#vName', 8.5, { dur: 1.2 }); reveal(tl, '#vSub', 8.85, { dur: 1.0, from: '.08em', to: '0em' });
reveal(tl, '#vAtm', 9.7, { dur: 1.0 }); reveal(tl, '#vAtm2', 10.0, { dur: .9, from: '.08em', to: '0em' });
['#vName', '#vSub', '#vAtm', '#vAtm2'].forEach(s => hide(tl, s, 11.55, .6));
reveal(tl, '#vNum', 12.05, { dur: 1.3, from: '0.18em', to: '0em' });
reveal(tl, '#vEnd', 12.6, { dur: 1.1 }); reveal(tl, '#vEnd2', 13.1, { dur: 1.0, from: '.08em', to: '0em' });
let seek = 0, lay = 0;
for (let f = 0; f < 450; f++) {
  const a = performance.now(); tl.seek(f / 30, false); const b = performance.now();
  document.body.offsetHeight; document.querySelector('#vNum').getBoundingClientRect(); const c = performance.now();
  seek += b - a; lay += c - b;
}
document.getElementById('res').textContent = `450 frames\nseek ${seek.toFixed(1)} ms\nlayout ${lay.toFixed(1)} ms\nper100 ${((seek + lay) / 4.5).toFixed(1)} ms`;
document.querySelectorAll('.t').forEach(e => e.style.display = 'none');
S.installContract({ duration: 1, ready: Promise.resolve(), renderAt: () => {} });
</script></body></html>
