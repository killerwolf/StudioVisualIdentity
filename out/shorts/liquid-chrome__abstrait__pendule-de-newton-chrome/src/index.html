<!doctype html><html lang="fr"><head><meta charset="utf-8">
<!--
  Chrome Liquide — « Le pendule de Newton chromé qui ne s'arrête jamais » (famille abstrait)
  Babylon.js 9.33 (UMD) : 5 billes PBR chrome irisées, environnement procédural rendu UNE fois par ReflectionProbe
  (sphère dégradé graphite/perle + panneaux lilas/rose/menthe/or/blanc, puis masqués), GlowLayer (éclats de choc,
  liseré du socle), DefaultRenderingPipeline (ACES, profondeur de champ). Aucun asset téléchargé.
  Mouvement 100 % analytique et verrouillé sur la période : T = 2,4 s, 5 cycles en 12 s -> boucle parfaite
  (caméra périodique 12 s). Pas de runRenderLoop : scene.render() dans renderAt(t). Graine : SEED = 3 (aucun aléa utilisé
  hors micro-vibration déterministe).
-->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#121016}
  canvas{position:absolute;inset:0;width:1080px;height:1920px}
  .card{position:absolute;left:0;top:0;width:1080px;opacity:0}
  .cap{position:absolute;left:72px;top:232px;font:500 54px Inter;letter-spacing:.2em;color:#C8D3FF;white-space:nowrap}
  h1{position:absolute;left:72px;top:306px;width:900px;margin:0;font:800 92px/1.0 Syne;letter-spacing:-0.03em;color:#FFFFFF}
  .g{background:linear-gradient(90deg,#C8D3FF,#FF9AE8 45%,#7CF7E4 80%,#FFE29A);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="card" id="k1"><div class="cap">MATIÈRE · CHROME</div><h1>Le pendule<br>qui ne<br>s'arrête<br><span class="g">jamais.</span></h1></div>
<div class="card" id="k2"><div class="cap">5 BILLES · 1 CHOC</div><h1>L'élan<br><span class="g">traverse.</span></h1></div>
<div class="card" id="k3"><div class="cap">EN VRAI, IL FREINE</div><h1>Ici,<br><span class="g">jamais.</span></h1></div>
<script src="/node_modules/babylonjs/babylon.js"></script>
<script type="module">
import * as S from '/out/tools/lib/svi.js';
const B = window.BABYLON;
const W = 1080, H = 1920, DUR = 12, T = 2.4, A = 0.45, L = 3.2, R = 0.5, GAP = 1.004, N = 5, SEED = 3;
const PAL = ['#C8D3FF', '#FF9AE8', '#F4EEF8', '#7CF7E4', '#FFE29A'];   // la bille du centre est perle
const canvas = document.getElementById('c');
const engine = new B.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
engine.setHardwareScalingLevel(1);
const scene = new B.Scene(engine);
scene.clearColor = B.Color4.FromHexString('#121016FF');
const c3 = h => B.Color3.FromHexString(h);

// ---------- environnement procédural (rendu une seule fois dans une sonde) ----------
const envMeshes = [];
const sky = B.MeshBuilder.CreateSphere('sky', { diameter: 80, segments: 32, sideOrientation: B.Mesh.BACKSIDE }, scene);
const skyTex = new B.DynamicTexture('skyTex', { width: 16, height: 512 }, scene, false);
{ const g = skyTex.getContext(); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0.00, '#F6F1F8'); gr.addColorStop(0.30, '#CFC6D6'); gr.addColorStop(0.46, '#17141C'); gr.addColorStop(0.50, '#E8DFEE');
  gr.addColorStop(0.53, '#1C1820'); gr.addColorStop(1.00, '#2A2430'); g.fillStyle = gr; g.fillRect(0, 0, 16, 512); skyTex.update(); }
const skyMat = new B.StandardMaterial('skyMat', scene); skyMat.disableLighting = true; skyMat.emissiveTexture = skyTex; skyMat.backFaceCulling = false;
sky.material = skyMat; envMeshes.push(sky);
const panel = (hex, w, h, pos, k = 1) => {
  const p = B.MeshBuilder.CreatePlane('pn', { width: w, height: h, sideOrientation: B.Mesh.DOUBLESIDE }, scene);
  p.position = new B.Vector3(...pos); p.lookAt(B.Vector3.Zero());
  const m = new B.StandardMaterial('pm', scene); m.disableLighting = true; m.emissiveColor = c3(hex).scale(k); p.material = m; envMeshes.push(p); return p; };
panel('#C8D3FF', 30, 8, [0, 16, 4], 1.6);
panel('#FF9AE8', 8, 22, [-17, 2, 4], 1.7);
panel('#7CF7E4', 6, 18, [17, 3, -4], 1.3);
panel('#FFE29A', 26, 4, [0, -12, 6], 1.5);
panel('#FFFFFF', 7, 7, [8, 10, -14], 2.4);
panel('#FFE9C8', 10, 10, [-6, 6, -18], 1.2);      // clé chaude (perle/or) : moins « néon froid »
const probe = new B.ReflectionProbe('probe', 256, scene, true, true);
probe.refreshRate = B.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
probe.position = new B.Vector3(0, 1.6, 0);
envMeshes.forEach(m => probe.renderList.push(m));
scene.environmentTexture = probe.cubeTexture;

// ---------- matières ----------
const pbr = (name, hex, metal, rough, o = {}) => { const m = new B.PBRMaterial(name, scene); m.albedoColor = c3(hex); m.metallic = metal; m.roughness = rough;
  m.environmentIntensity = o.env ?? 1.0; if (o.irid) { m.iridescence.isEnabled = true; m.iridescence.intensity = o.irid; m.iridescence.indexOfRefraction = 1.35; m.iridescence.minimumThickness = 120; m.iridescence.maximumThickness = 420; }
  if (o.clear) { m.clearCoat.isEnabled = true; m.clearCoat.intensity = o.clear; m.clearCoat.roughness = 0.04; } return m; };
const chrome = pbr('chrome', '#E9E6EE', 1, 0.07, { irid: 0.35, env: 1.15 });
const darkChrome = pbr('dchrome', '#8C8794', 1, 0.16, { env: 0.9 });
const stringMat = pbr('str', '#D8D2DE', 1, 0.3, { env: 0.8 });
const ballMat = PAL.map((h, i) => { const col = B.Color3.Lerp(c3(h), c3('#FFFFFF'), 0.35); const m = pbr('ball' + i, col.toHexString(), 1, 0.045, { irid: 0.55, env: 1.25, clear: 0.6 });
  m.emissiveColor = c3(h).scale(0.025); return m; });
const baseMat = pbr('base', '#4A4250', 0.35, 0.16, { env: 1.0, clear: 1 });

// ---------- pendule ----------
const YT = 4.25, Y_REST = YT - L, ZB = 0.95, XP = 4.3;
const X0 = i => (i - (N - 1) / 2) * GAP;
const bar = (a, b, r, mat) => { const m = B.MeshBuilder.CreateCylinder('bar', { height: 1, diameter: 2 * r, tessellation: 24 }, scene); m.material = mat; m.rotationQuaternion = new B.Quaternion(); setSeg(m, a, b); return m; };
const UP = new B.Vector3(0, 1, 0), tmpD = new B.Vector3();
function setSeg(m, a, b) { b.subtractToRef(a, tmpD); const len = tmpD.length(); tmpD.scaleInPlace(1 / len);
  B.Quaternion.FromUnitVectorsToRef(UP, tmpD, m.rotationQuaternion); m.scaling.y = len; m.position.copyFrom(a).addInPlace(b).scaleInPlace(0.5); }
const V = (x, y, z) => new B.Vector3(x, y, z);
for (const z of [-ZB, ZB]) { bar(V(-XP, YT, z), V(XP, YT, z), 0.06, chrome); bar(V(-XP, 0.25, z), V(-XP, YT, z), 0.07, chrome); bar(V(XP, 0.25, z), V(XP, YT, z), 0.07, chrome); }
const base = B.MeshBuilder.CreateBox('base', { width: 2 * XP + 0.9, height: 0.25, depth: 2 * ZB + 1.0 }, scene); base.position.y = 0.125; base.material = baseMat;
const strip = B.MeshBuilder.CreateBox('strip', { width: 2 * XP + 0.9, height: 0.025, depth: 0.025 }, scene); strip.position.set(0, 0.26, -(ZB + 0.5));
const stripMat = new B.StandardMaterial('stripM', scene); stripMat.disableLighting = true; stripMat.emissiveColor = c3('#FFE9F4').scale(0.9); strip.material = stripMat;
// fond : calque 2D graphite chaud + halos perle/or/rose (pas de sol infini : bord dur au loin)
const bgTex = new B.DynamicTexture('bg', { width: 540, height: 960 }, scene, false);
{ const g = bgTex.getContext(); const lg = g.createLinearGradient(0, 0, 0, 960); lg.addColorStop(0, '#121016'); lg.addColorStop(0.55, '#1A161E'); lg.addColorStop(1, '#100E13');
  g.fillStyle = lg; g.fillRect(0, 0, 540, 960);
  const halo = (x, y, r, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(18,16,22,0)'); g.fillStyle = gr; g.fillRect(0, 0, 540, 960); };
  halo(270, 560, 330, 'rgba(237,230,242,0.13)'); halo(430, 500, 260, 'rgba(255,226,154,0.10)'); halo(110, 620, 260, 'rgba(255,154,232,0.10)'); halo(270, 760, 200, 'rgba(255,233,200,0.06)');
  bgTex.update(); }
const bgLayer = new B.Layer('bgl', null, scene, true); bgLayer.texture = bgTex;
// ombres de contact : disques à dégradé radial sous chaque bille
const shTex = new B.DynamicTexture('sh', { width: 128, height: 128 }, scene, false); shTex.hasAlpha = true;
{ const g = shTex.getContext(); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,0.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); shTex.update(); }
const shMat = new B.StandardMaterial('shm', scene); shMat.diffuseTexture = shTex; shMat.useAlphaFromDiffuseTexture = true; shMat.disableLighting = true; shMat.emissiveColor = B.Color3.Black(); shMat.specularColor = B.Color3.Black();
const balls = [], strings = [], shadows = [], flashes = [];
for (let i = 0; i < N; i++) {
  const b = B.MeshBuilder.CreateSphere('ball' + i, { diameter: 2 * R, segments: 48 }, scene); b.material = ballMat[i]; balls.push(b);
  strings.push([bar(V(0, 0, 0), V(0, 1, 0), 0.012, stringMat), bar(V(0, 0, 0), V(0, 1, 0), 0.012, stringMat)]);
  const s = B.MeshBuilder.CreatePlane('s', { size: 1.4 }, scene); s.rotation.x = Math.PI / 2; s.position.y = 0.262; s.material = shMat; shadows.push(s);
}
for (let j = 0; j < 2; j++) { const f = B.MeshBuilder.CreateSphere('f', { diameter: 0.2, segments: 16 }, scene); const m = new B.StandardMaterial('fm', scene);
  m.disableLighting = true; m.emissiveColor = c3('#FFF6FB'); f.material = m; flashes.push(f); }
const glow = new B.GlowLayer('glow', scene, { mainTextureFixedSize: 512, blurKernelSize: 64 });
glow.intensity = 0.9;
glow.customEmissiveColorSelector = (mesh, sub, mat, result) => {
  if (mesh.name === 'f') result.set(1, 0.96, 0.99, 1); else if (mesh.name === 'strip') result.set(1, 0.9, 0.96, 1);
  else if (mesh.name.startsWith('ball')) { const c = c3(PAL[+mesh.name.slice(4)]).scale(0.03); result.set(c.r, c.g, c.b, 1); } else result.set(0, 0, 0, 0); };

// ---------- caméra & post ----------
const cam = new B.UniversalCamera('cam', V(0, 2, -20), scene); cam.fov = 0.62; cam.minZ = 0.1; cam.maxZ = 200;
const pipe = new B.DefaultRenderingPipeline('p', true, scene, [cam]);
pipe.samples = 1; pipe.fxaaEnabled = true;
pipe.imageProcessingEnabled = true;
pipe.imageProcessing.toneMappingEnabled = true; pipe.imageProcessing.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipe.imageProcessing.exposure = 1.15; pipe.imageProcessing.contrast = 1.12;
pipe.imageProcessing.vignetteEnabled = true; pipe.imageProcessing.vignetteWeight = 1.6; pipe.imageProcessing.vignetteColor = new B.Color4(0.07, 0.06, 0.09, 0);
pipe.depthOfFieldEnabled = true; pipe.depthOfFieldBlurLevel = B.DepthOfFieldEffectBlurLevel.Low;
pipe.depthOfField.focalLength = 110; pipe.depthOfField.fStop = 1.6; pipe.depthOfField.lensSize = 50;
const hemi = new B.HemisphericLight('h', V(0, 1, 0), scene); hemi.intensity = 0.15;

// ---------- mouvement analytique, période verrouillée ----------
const theta = (i, t) => { const s = Math.sin(2 * Math.PI * t / T);
  if (i === N - 1) return A * Math.max(s, 0); if (i === 0) return A * Math.min(s, 0); return 0; };
// micro-vibration des billes centrales juste après chaque choc (onde de compression), amortie
const jiggle = (i, t) => { const ph = ((t % (T / 2)) + T / 2) % (T / 2); const k = Math.floor(t / (T / 2)); const dir = k % 2 === 0 ? 1 : -1;
  return (i > 0 && i < N - 1) ? dir * 0.006 * Math.exp(-ph * 22) * Math.sin(ph * 90) : 0; };
const fade = (t, a, b, d = 0.45) => S.seg(t, a, a + d, S.ease.outCubic) * (1 - S.seg(t, b - 0.35, b));

function renderAt(t) {
  // caméra : 3/4 avant, dérive + respiration périodiques sur 12 s (boucle parfaite)
  const u = 2 * Math.PI * t / DUR;
  const az = -0.88 + 0.07 * Math.sin(u), el = 0.13 + 0.02 * Math.sin(2 * u + 0.7), rad = 13.6 - 0.5 * Math.cos(u);
  const tgt = V(-0.35 + 0.12 * Math.sin(u), 3.25, 0);
  cam.position.set(tgt.x + rad * Math.sin(az) * Math.cos(el), tgt.y + rad * Math.sin(el), tgt.z - rad * Math.cos(az) * Math.cos(el));
  cam.setTarget(tgt);
  pipe.depthOfField.focusDistance = B.Vector3.Distance(cam.position, V(X0(N - 1), Y_REST, 0)) * 1000;
  for (let i = 0; i < N; i++) {
    const th = theta(i, t), px = X0(i) + jiggle(i, t);
    const cx = px + L * Math.sin(th), cy = YT - L * Math.cos(th);
    balls[i].position.set(cx, cy, 0);
    setSeg(strings[i][0], V(cx, cy, 0), V(px, YT, -ZB)); setSeg(strings[i][1], V(cx, cy, 0), V(px, YT, ZB));
    const lift = cy - Y_REST; shadows[i].position.x = cx; shadows[i].scaling.setAll(1 + lift * 0.9); shadows[i].visibility = Math.max(0.25, 1 - lift * 0.9);
  }
  // éclats de choc : à chaque passage par zéro (t = k·T/2), au point de contact entrant et sortant
  const k = Math.round(t / (T / 2)), dt = t - k * T / 2, side = k % 2 === 0 ? -1 : 1;
  const e = dt >= -0.02 ? Math.exp(-Math.max(0, dt) * 9) : 0;
  // l'éclat est avancé vers la caméra (sinon il reste caché entre les deux sphères qui se touchent)
  [side, -side].forEach((sd, j) => { const p = V(sd * (X0(N - 1) - GAP / 2), Y_REST, 0); const d = cam.position.subtract(p).normalize().scale(0.62); flashes[j].position.copyFrom(p.add(d)); });
  flashes[0].scaling.setAll(0.2 + 1.1 * e); flashes[1].scaling.setAll(0.2 + 0.7 * e);
  flashes.forEach(f => { f.visibility = e; f.isVisible = e > 0.02; });
  document.getElementById('k1').style.opacity = t < 0.05 ? 1 : 1 - S.seg(t, 3.8, 4.15);
  document.getElementById('k2').style.opacity = fade(t, 4.6, 8.2);
  document.getElementById('k3').style.opacity = fade(t, 8.8, 11.9);
  scene.render();
}
const ready = (async () => {
  await S.loadFonts([{ family: 'Syne', pkg: 'syne', weight: 800 }, { family: 'Inter', pkg: 'inter', weight: 500 }]);
  await scene.whenReadyAsync();
  renderAt(0); renderAt(0);                       // la sonde capture l'environnement (RENDER_ONCE)
  envMeshes.forEach(m => m.setEnabled(false));    // puis l'environnement disparaît de la vue
  await scene.whenReadyAsync();
  renderAt(0);
})();
S.installContract({ renderAt, ready, duration: DUR });
window.LOOP = { T, DUR };
</script></body></html>
