<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- overlay.html — calque animé TRANSPARENT de la démo « 14 styles » (rendu par render.mjs --alpha, posé sur la mosaïque ffmpeg).
     ?fmt=16x9 | 9x16 ; géométrie et timeline : layout.json (écrit par build.py). Déterministe : tout dépend de t. -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as S from '/out/tools/lib/svi.js';
const fmt = new URLSearchParams(location.search).get('fmt') || '16x9';
const L = await (await fetch('./layout.json')).json();
const F = L.formats[fmt], T = L.timeline, TL = L.tiles;
const W = F.W, H = F.H, [TW, TH] = F.tile;
const V = fmt === '9x16';
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H; const ox = off.getContext('2d');
const E = S.ease, seg = S.seg, clamp = S.clamp;
const INK = '#0c0b1a', HOT = '#FF3D6E', YEL = '#FFE600', CYA = '#38F9FF', GRN = '#3CF2A0';

function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lum(hex) { const [r, gg, b] = S.hexToRgb(hex).map(v => v / 255); return 0.2126 * r + 0.7152 * gg + 0.0722 * b; }
function font(g, w, size, fam) { g.font = `${w} ${size}px ${fam}`; }
function fitText(g, txt, w, maxSize, maxW, fam) { let s = maxSize; font(g, w, s, fam); while (g.measureText(txt).width > maxW && s > 20) { s -= 2; font(g, w, s, fam); } return s; }
function pill(g, x, y, txt, bg, size) {
  font(g, 700, size, 'Inter'); const tw = g.measureText(txt).width, ph = size * 1.7, pw = tw + size * 1.4;
  g.fillStyle = bg; rr(g, x - pw / 2, y - ph / 2, pw, ph, ph / 2); g.fill();
  g.fillStyle = lum(bg) > 0.55 ? '#0c0b1a' : '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, x, y + 1);
}
function center() { return V ? [540, 720] : [W / 2, H / 2]; }   // 9:16 : carte des cellules vides (270..810, 480..960)

// ---------- 0 — accroche : mur de templates identiques ----------
function blandTile(g, x, y, t) {
  const gr = g.createLinearGradient(x, y, x + TW, y + TH); gr.addColorStop(0, '#7B61FF'); gr.addColorStop(1, '#36B9FF');
  g.fillStyle = gr; rr(g, x + 5, y + 5, TW - 10, TH - 10, 18); g.fill();
  const p = (t % 1.6) / 1.6, k = E.outBack(clamp(p / 0.35));
  const s = 1 + 0.06 * Math.sin(t * 6);
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(x + TW / 2, y + TH * 0.26, TW * 0.1 * s, 0, Math.PI * 2); g.fill();
  const cw = TW * 0.74, ch = TH * 0.2, cx = x + (TW - cw) / 2, cy = y + TH * 0.52 + (1 - k) * TH * 0.5;
  g.save(); g.beginPath(); g.rect(x + 5, y + 5, TW - 10, TH - 10); g.clip();
  g.fillStyle = '#ffffff'; rr(g, cx, cy, cw, ch, 14); g.fill();
  g.fillStyle = '#2d2a4a'; font(g, 600, Math.round(TW * 0.075), 'Inter'); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Your Title Here', x + TW / 2, cy + ch * 0.36);
  g.fillStyle = '#c9c6e8'; rr(g, cx + cw * 0.18, cy + ch * 0.62, cw * 0.64, ch * 0.1, 4); g.fill();
  g.restore();
}
function hook(t) {
  const g = ox; g.clearRect(0, 0, W, H); g.fillStyle = '#100e22'; g.fillRect(0, 0, W, H);
  F.cells.forEach(([x, y]) => blandTile(g, x, y, t));
  if (V) F.empty.forEach(([x, y, w, h]) => { blandTile(g, x, y, t); blandTile(g, x + TW, y, t); });
  // titre
  const [cx, cy] = V ? [540, 860] : [W / 2, H / 2];
  const bandH = V ? 720 : 300, a1 = seg(t, 0.15, 0.4, E.outExpo), a2 = seg(t, T.CUES.hookLine2, T.CUES.hookLine2 + 0.25, E.outExpo);
  g.fillStyle = `rgba(8,7,18,${0.82 * a1})`; g.fillRect(0, cy - bandH / 2, W, bandH);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const L1 = V ? ["EVERYONE'S", 'VIDEO'] : ["EVERYONE'S VIDEO"], L2 = V ? ['LOOKS', 'THE SAME.'] : ['LOOKS THE SAME.'];
  const sz = V ? Math.min(fitText(g, "EVERYONE'S", 900, 150, 860, 'Unbounded'), fitText(g, 'THE SAME.', 900, 150, 860, 'Unbounded'))
               : fitText(g, "EVERYONE'S VIDEO", 900, 120, 1500, 'Unbounded');
  font(g, 900, sz, 'Unbounded');
  const lh = sz * 1.08, all = [...L1.map(x => [x, '#ffffff', a1, 0.25]), ...L2.map(x => [x, HOT, a2, 0.35])];
  all.forEach(([txt, col, a, k], j) => {
    g.save(); g.globalAlpha = a; g.translate(cx, cy + (j - (all.length - 1) / 2) * lh); g.scale(1 + k * (1 - a), 1 + k * (1 - a));
    g.fillStyle = col; g.fillText(txt, 0, 0); g.restore();
  });
  // composition + glitch
  ctx.drawImage(off, 0, 0);
  if (t > 2.7) {
    const r = S.rng(Math.floor(t * 30) * 7919 + 3), n = 6 + Math.floor(seg(t, 2.7, T.CUT) * 10);
    for (let k = 0; k < n; k++) {
      const y = r() * H, h = 12 + r() * 70, dx = (r() - 0.5) * 140 * seg(t, 2.7, T.CUT);
      ctx.drawImage(off, 0, y, W, h, dx, y, W, h);
    }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5 * seg(t, 2.7, T.CUT);
    ctx.fillStyle = 'rgba(255,0,80,0.25)'; ctx.fillRect(8, 0, W, H); ctx.fillStyle = 'rgba(0,255,255,0.18)'; ctx.fillRect(-8, 0, W, H); ctx.restore();
  }
}
function shutter(t) {   // ouverture en volets noirs depuis le centre (révèle la mosaïque)
  const k = seg(t, T.CUT, T.CUT + 0.28, E.outQuart), hh = (H / 2) * (1 - k);
  ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, hh); ctx.fillRect(0, H - hh, W, hh);
}

// ---------- vignettes : étiquettes, voiles, bordures ----------
function tileLabel(i, a, t) {
  const tile = TL[i], [x, y] = F.cells[i]; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; pill(ctx, x + TW / 2, y + TH - (V ? 44 : 46), tile.name.toUpperCase(), tile.accent, V ? 19 : 18); ctx.restore();
}
function eq(x, y, t, col) { // petit égaliseur « son actif »
  ctx.fillStyle = col;
  for (let k = 0; k < 4; k++) { const h = 8 + 18 * Math.abs(Math.sin(t * (7 + k * 2.3) + k)); ctx.fillRect(x + k * 9, y - h, 6, h); }
}
function grid(t, phase) {
  const intro = phase === 'intro';
  TL.forEach((tile, i) => {
    const [x, y] = F.cells[i];
    const on = tile.audibleFrom != null && t >= tile.audibleFrom && t < T.CEND;
    if (intro) { tileLabel(i, seg(t, T.CUT + 0.3 + 0.06 * i, T.CUT + 0.5 + 0.06 * i), t); return; }
    if (!on) {
      ctx.fillStyle = `rgba(6,6,14,${0.74 * seg(t, T.C0, T.C0 + 0.35)})`; ctx.fillRect(x, y, TW, TH);
      tileLabel(i, 0.35, t);
    } else {
      const p = seg(t, tile.audibleFrom, tile.audibleFrom + 0.35, E.outBack), pulse = 1 - seg(t, tile.audibleFrom, tile.audibleFrom + 0.5);
      ctx.save(); ctx.shadowColor = tile.accent; ctx.shadowBlur = 30 + 30 * pulse; ctx.strokeStyle = tile.accent; ctx.lineWidth = 6 + 8 * pulse;
      const m = 6 - 6 * p; ctx.strokeRect(x + 4 + m, y + 4 + m, TW - 8 - 2 * m, TH - 8 - 2 * m); ctx.restore();
      if (pulse > 0) { ctx.fillStyle = `rgba(255,255,255,${0.25 * pulse})`; ctx.fillRect(x, y, TW, TH); }
      tileLabel(i, 1, t); eq(x + 18, y + 54, t, tile.accent);
    }
  });
}
function counterCard(t) {
  const n = T.COUNTS[Math.min(T.COUNTS.length - 1, Math.floor((t - T.C0) / T.CD))], c = Math.floor((t - T.C0) / T.CD);
  const since = t - (T.C0 + c * T.CD), pop = 1 + 0.35 * (1 - seg(since, 0, 0.3, E.outExpo));
  const last = c >= T.COUNTS.length - 1, shake = last ? seg(t, T.C0 + c * T.CD, T.CEND) : 0;
  const r = S.rng(Math.floor(t * 30) + 11);
  let [cx, cy] = center(); cx += (r() - 0.5) * 16 * shake; cy += (r() - 0.5) * 16 * shake;
  const w = V ? 500 : 440, h = V ? 300 : 170;
  ctx.fillStyle = 'rgba(12,11,26,0.92)'; rr(ctx, cx - w / 2, cy - h / 2, w, h, 26); ctx.fill();
  ctx.strokeStyle = last ? HOT : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; rr(ctx, cx - w / 2, cy - h / 2, w, h, 26); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.translate(cx, cy - (V ? 30 : 12)); ctx.scale(pop, pop);
  ctx.fillStyle = last ? HOT : YEL; font(ctx, 400, V ? 150 : 104, 'Archivo Black'); ctx.fillText(`${n}`, 0, 0); ctx.restore();
  ctx.fillStyle = '#ffffff'; font(ctx, 700, V ? 34 : 26, 'Inter');
  ctx.fillText(n === 1 ? 'VOICE AT ONCE' : 'VOICES AT ONCE', cx, cy + (V ? 95 : 60));
  if (last) { ctx.globalAlpha = seg(t, T.CEND - 3, T.CEND - 2.6); ctx.fillStyle = HOT; font(ctx, 800, V ? 30 : 22, 'Inter');
    ctx.fillText('THIS IS WHAT CHOOSING SOUNDS LIKE', cx, cy - h / 2 - (V ? 40 : 26)); ctx.globalAlpha = 1; }
}
function introCard(t) {
  const [cx, cy] = center(), a = seg(t, T.CUT + 0.25, T.CUT + 0.55, E.outExpo), b = seg(t, T.CUES.noneAlike, T.CUES.noneAlike + 0.25, E.outExpo);
  const w = V ? 520 : 760, h = V ? 440 : 210;
  ctx.globalAlpha = Math.max(a, 0.001);
  ctx.fillStyle = 'rgba(12,11,26,0.9)'; rr(ctx, cx - w / 2, cy - h / 2, w, h, 26); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff'; font(ctx, 900, V ? 64 : 64, 'Unbounded');
  if (V) { ctx.fillText('14', cx, cy - 120); font(ctx, 800, 44, 'Unbounded'); ctx.fillText('IDENTITIES.', cx, cy - 40); }
  else ctx.fillText('14 IDENTITIES.', cx, cy - 38);
  ctx.globalAlpha = b; ctx.fillStyle = YEL; font(ctx, 900, V ? 50 : 64, 'Unbounded');
  ctx.save(); ctx.translate(cx, cy + (V ? 90 : 48)); const sc = 1 + 0.4 * (1 - b); ctx.scale(sc, sc); ctx.fillText('NONE ALIKE.', 0, 0); ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- 37.4 — trop de choix ----------
function tooMany(t) {
  ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
  const a = seg(t, 37.75, 38.6, E.inOutSine), [cx, cy] = V ? [540, 900] : [W / 2, H / 2];
  ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#d8d6ea';
  font(ctx, 300, V ? 64 : 76, 'Unbounded'); ctx.fillText('too many choices?', cx, cy); ctx.globalAlpha = 1;
}

// ---------- 39.4 — terminal ----------
const PROMPT = 'Read AGENTS.md from github.com/killerwolf/StudioVisualIdentity. Pick a style for a geography quiz channel for teens. Bootstrap our studio and make episode 1.';
const CHECKS = ['✓ style chosen: Swiss Grid', '✓ studio bootstrapped: geo-quiz/', '✓ episode 1 rendered · check OK'];
function wrap(g, txt, maxW) {   // retour à la ligne par mots ; un mot plus large que la ligne est coupé après un « / » ou au caractère
  const words = [];
  for (const w of txt.split(' ')) {
    if (g.measureText(w).width <= maxW) { words.push(w); continue; }
    let cur = '';
    for (const ch of w) { if (g.measureText(cur + ch).width > maxW) { words.push(cur); cur = ''; } cur += ch; if (ch === '/' && g.measureText(cur).width > maxW * 0.6) { words.push(cur); cur = ''; } }
    if (cur) words.push(cur);
  }
  const out = []; let line = '';
  for (const w of words) { const tst = line ? line + ' ' + w : w; if (g.measureText(tst).width > maxW && line) { out.push(line); line = w; } else line = tst; }
  if (line) out.push(line); return out;
}
function bgDots(alpha) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(255,255,255,${0.06 * alpha})`;
  for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) ctx.fillRect(x, y, 2, 2);
}
function terminal(t, dim) {
  const [x, y, w, h] = F.terminal, a = seg(t, T.TERM, T.TERM + 0.35, E.outExpo);
  ctx.save(); ctx.globalAlpha = a * (dim ?? 1); ctx.translate(0, (1 - a) * 40);
  ctx.fillStyle = '#14131f'; rr(ctx, x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; rr(ctx, x, y, w, h, 22); ctx.stroke();
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 34 + k * 30, y + 32, 9, 0, 7); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; font(ctx, 500, V ? 24 : 24, 'JetBrains Mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('your agent', x + 140, y + 39);
  const fs = V ? 34 : 40, lh = fs * 1.45; font(ctx, 500, fs, 'JetBrains Mono');
  const n = Math.floor(PROMPT.length * seg(t, T.CUES.typeStart, T.CUES.typeEnd));
  const lines = wrap(ctx, PROMPT, w - 110);
  let shown = n, yy = y + 110;
  ctx.fillStyle = GRN; ctx.fillText('>', x + 36, yy);
  ctx.fillStyle = '#f1f0ff';
  let lastX = x + 76, lastY = yy;
  for (const ln of lines) {
    if (shown <= 0) break;
    const part = ln.slice(0, shown); ctx.fillText(part, x + 76, yy); lastX = x + 76 + ctx.measureText(part).width; lastY = yy;
    shown -= ln.length + 1; yy += lh;
  }
  if (Math.floor(t * 2.5) % 2 === 0 || t < T.CUES.typeEnd) { ctx.fillStyle = '#f1f0ff'; ctx.fillRect(lastX + 4, lastY - fs * 0.8, fs * 0.55, fs * 0.95); }
  yy = Math.max(yy, y + 110 + lh * lines.length) + lh * 0.6;
  CHECKS.forEach((c, k) => {
    const b = seg(t, T.CUES.checks[k], T.CUES.checks[k] + 0.2, E.outExpo); if (b <= 0) return;
    ctx.globalAlpha = a * (dim ?? 1) * b; ctx.fillStyle = GRN; ctx.fillText(c, x + 36 + (1 - b) * 30, yy + k * lh);
  });
  ctx.restore();
}

// ---------- 47 — l'épisode produit ----------
function result(t) {
  const [rx, ry, rw, rh] = F.result, k = seg(t, T.RES0, T.RES0 + 0.45, E.outBack);
  bgDots(1);
  if (!V) terminal(t, 0.55);
  const cx = rx + rw / 2, cy = ry + rh / 2, w = rw * (0.86 + 0.14 * k), h = rh * (0.86 + 0.14 * k);
  ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000'; rr(ctx, cx - w / 2, cy - h / 2, w, h, 34); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#E3241B'; ctx.lineWidth = 10; rr(ctx, cx - w / 2 - 5, cy - h / 2 - 5, w + 10, h + 10, 38); ctx.stroke();
  const a = seg(t, T.RES0 + 0.3, T.RES0 + 0.6);
  ctx.globalAlpha = a; ctx.textBaseline = 'middle';
  if (V) { ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; font(ctx, 800, 44, 'Unbounded'); ctx.fillText('EPISODE 1 · READY', 540, 290); }
  else { ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; font(ctx, 900, 64, 'Unbounded'); ctx.fillText('Episode 1.', 150, 900);
    ctx.fillStyle = YEL; ctx.fillText('Ready.', 150, 980); }
  ctx.globalAlpha = 1;
}

// ---------- 51.3 — slams ----------
const SL = [['14 STYLES', YEL], ['31 VIDEOS', CYA], ['OPEN SOURCE', HOT]];
function slams(t) {
  ctx.fillStyle = `rgba(6,6,14,${0.66 * seg(t, T.SLAM, T.SLAM + 0.2)})`; ctx.fillRect(0, 0, W, H);
  let shake = 0; T.SLAMS.forEach(s0 => { shake = Math.max(shake, 1 - seg(t, s0, s0 + 0.18)) * (t >= s0 ? 1 : 0); });
  const r = S.rng(Math.floor(t * 30) + 5); ctx.save(); ctx.translate((r() - 0.5) * 18 * shake, (r() - 0.5) * 18 * shake);
  const ys = V ? [700, 960, 1220] : [300, 540, 780];
  SL.forEach(([txt, col], k) => {
    const s0 = T.SLAMS[k]; if (t < s0) return;
    const p = seg(t, s0, s0 + 0.18, E.outExpo), sc = 1 + 0.7 * (1 - p);
    ctx.save(); ctx.translate(V ? 540 : W / 2, ys[k]); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 3);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText(ctx, txt, 400, V ? 150 : 190, V ? 880 : 1500, 'Archivo Black');
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(txt, 6, 8); ctx.fillStyle = col; ctx.fillText(txt, 0, 0); ctx.restore();
  });
  ctx.restore();
}

// ---------- 57 — fin ----------
function endCard(t) {
  const a = seg(t, T.END, T.END + 0.35, E.outExpo);
  ctx.globalAlpha = a; bgDots(1); ctx.globalAlpha = 1;
  const bandY = V ? 560 : 250, bandH = V ? 160 : 120, bw = W / TL.length;
  TL.forEach((tile, i) => {
    const b = seg(t, T.END + 0.1 + i * 0.04, T.END + 0.4 + i * 0.04, E.outBack); if (b <= 0) return;
    const h = bandH * b; ctx.fillStyle = tile.bg; ctx.fillRect(i * bw, bandY + (bandH - h), bw + 1, h * 0.62);
    ctx.fillStyle = tile.accent; ctx.fillRect(i * bw, bandY + (bandH - h) + h * 0.62, bw + 1, h * 0.38);
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx = W / 2, b1 = seg(t, T.END + 0.3, T.END + 0.7, E.outExpo), b2 = seg(t, T.END + 0.9, T.END + 1.3, E.outExpo), b3 = seg(t, T.END + 1.6, T.END + 2.0);
  ctx.globalAlpha = b1; ctx.fillStyle = '#ffffff';
  if (V) { font(ctx, 900, 92, 'Unbounded'); ['Studio', 'Visual', 'Identity'].forEach((w, k) => ctx.fillText(w, cx, 900 + k * 108)); }
  else { fitText(ctx, 'Studio Visual Identity', 900, 110, 1600, 'Unbounded'); ctx.fillText('Studio Visual Identity', cx, 520); }
  ctx.globalAlpha = b2; ctx.fillStyle = CYA; fitText(ctx, L.url, 600, V ? 40 : 44, V ? 900 : 1500, 'JetBrains Mono');
  ctx.fillText(L.url, cx, V ? 1290 : 660);
  ctx.globalAlpha = b3; ctx.fillStyle = '#c9c7e0'; font(ctx, 400, V ? 40 : 40, 'Inter');
  ctx.fillText('Give your agent one sentence.', cx, V ? 1400 : 760);
  ctx.globalAlpha = 1;
}

function renderAt(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < T.CUT) { hook(t); return; }
  if (t < T.CEND) {
    if (t < T.C0) { grid(t, 'intro'); introCard(t); }
    else { grid(t, 'cycles'); counterCard(t); }
    shutter(t); return;
  }
  if (t < T.TERM) { tooMany(t); return; }
  if (t < T.RES0) { bgDots(seg(t, T.TERM, T.TERM + 0.4)); terminal(t); return; }
  if (t < T.SLAM) { result(t); return; }
  if (t < T.END) { slams(t); return; }
  endCard(t);
}

S.installContract({
  duration: T.DUR, renderAt,
  ready: S.loadFonts([{ family: 'Unbounded', pkg: 'unbounded', weight: 300 }, { family: 'Unbounded', pkg: 'unbounded', weight: 800 },
    { family: 'Unbounded', pkg: 'unbounded', weight: 900 }, { family: 'Inter', pkg: 'inter', weight: 400 }, { family: 'Inter', pkg: 'inter', weight: 600 },
    { family: 'Inter', pkg: 'inter', weight: 700 }, { family: 'Inter', pkg: 'inter', weight: 800 }, { family: 'JetBrains Mono', pkg: 'jetbrains-mono', weight: 500 },
    { family: 'Archivo Black', pkg: 'archivo-black', weight: 400 }]),
});
</script>
</body></html>
