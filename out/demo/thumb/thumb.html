<!doctype html>
<html><head><meta charset="utf-8">
<!-- thumb.html — vignette « avant / après » de la démo (16:9). Dessinée en unités 1280×720, mise à l'échelle de la fenêtre.
     ?lang=fr|en. Rendu : node out/tools/render.mjs out/demo/thumb/thumb.html --width 1920 --height 1080 --stills 0 --query lang=fr -->
<style>html,body{margin:0;background:#0c0b1a;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as S from '/out/tools/lib/svi.js';
const lang = new URLSearchParams(location.search).get('lang') || 'fr';
const TX = {
  fr: { before: 'AVANT', same: ['TOUTES', 'PAREILLES.'], after: 'APRÈS', big: '14 STYLES', sub: 'AUCUN NE SE RESSEMBLE', card: 'Ton titre ici' },
  en: { before: 'BEFORE', same: ['ALL THE', 'SAME.'], after: 'AFTER', big: '14 STYLES', sub: 'NONE ALIKE', card: 'Your Title Here' },
}[lang];
const W = innerWidth, H = innerHeight, K = W / 1280;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const INK = '#0c0b1a', HOT = '#FF3D6E', YEL = '#FFE600';
const IDS = ['gazette-1900', 'neon-lab', 'pastel-diorama', 'pixel-arcade', 'swiss-data', 'cosmos-doc', 'riso-zine',
  'tableau-craie', 'bauhaus-kinetic', 'liquid-chrome', 'aquarelle-conte', 'brut-meme', 'atlas-grave', 'topo-relief'];
const ACC = {};
const imgs = {};
function load(id) { return new Promise(r => { const im = new Image(); im.onload = () => { imgs[id] = im; r(); }; im.src = `./frames/${id}.jpg`; }); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(w, s, f) { ctx.font = `${w} ${s}px ${f}`; }

// ligne de coupe : de (P1) en haut à (P2) en bas ; A = en haut à gauche, B = en bas à droite
const P1 = [960, 0], P2 = [330, 720];
function clipA() { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(...P1); ctx.lineTo(...P2); ctx.lineTo(0, 720); ctx.closePath(); ctx.clip(); }
function clipB() { ctx.beginPath(); ctx.moveTo(...P1); ctx.lineTo(1280, 0); ctx.lineTo(1280, 720); ctx.lineTo(...P2); ctx.closePath(); ctx.clip(); }

function blandCard(x, y, w, h) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#7B61FF'); g.addColorStop(1, '#36B9FF');
  ctx.fillStyle = g; rr(x, y, w, h, 12); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.2, w * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; rr(x + w * 0.1, y + h * 0.42, w * 0.8, h * 0.14, 8); ctx.fill();
  ctx.fillStyle = '#5a4fd0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; font(700, w * 0.1, 'Inter');
  ctx.fillText(TX.card, x + w / 2, y + h * 0.49);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; rr(x + w * 0.25, y + h * 0.66, w * 0.5, h * 0.03, 4); ctx.fill();
  rr(x + w * 0.32, y + h * 0.72, w * 0.36, h * 0.03, 4); ctx.fill();
}

function sideA() {
  ctx.save(); clipA();
  ctx.fillStyle = '#3a3a46'; ctx.fillRect(0, 0, 1280, 720);
  const w = 122, h = 217, gx = 12, gy = 14;
  for (let r = -1; r < 4; r++) for (let c = 0; c < 9; c++) blandCard(c * (w + gx) - 30 + (r % 2) * 20, r * (h + gy) + 18, w, h);
  // désaturé + assombri : « ennuyeux »
  ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'hsl(0,0%,50%)'; ctx.globalAlpha = 0.45; ctx.fillRect(0, 0, 1280, 720);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const v = ctx.createLinearGradient(0, 0, 700, 500); v.addColorStop(0, 'rgba(10,10,16,0.82)'); v.addColorStop(1, 'rgba(10,10,16,0.35)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 1280, 720);
  // texte
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  font(800, 26, 'Inter'); const bw = ctx.measureText(TX.before).width + 36;
  ctx.fillStyle = '#9a9aa8'; rr(48, 44, bw, 44, 22); ctx.fill(); ctx.fillStyle = '#16161e'; ctx.fillText(TX.before, 66, 75);
  ctx.fillStyle = '#e9e9f0'; font(900, 74, 'Unbounded');
  ctx.fillText(TX.same[0], 46, 170); ctx.fillText(TX.same[1], 46, 252);
  // rature sur « PAREILLES »
  ctx.restore();
}

function sideB() {
  ctx.save(); clipB();
  ctx.fillStyle = INK; ctx.fillRect(0, 0, 1280, 720);
  ctx.save(); ctx.translate(900, 300); ctx.rotate(-0.16);
  const w = 168, h = 299, g = 12, cols = 6;
  const order = [...IDS, ...IDS];
  let k = 0;
  for (let r = -2; r < 2; r++) for (let c = -3; c < cols - 2; c++) {
    const id = order[(k++ * 5) % IDS.length + 0];
    const x = c * (w + g) + (r % 2 ? w / 2 : 0) - 40, y = r * (h + g) + 20;
    ctx.save(); rr(x, y, w, h, 14); ctx.clip(); ctx.drawImage(imgs[id], x, y, w, h); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; rr(x, y, w, h, 14); ctx.stroke();
  }
  ctx.restore();
  // plaque sombre pour la promesse, en bas à droite
  const v = ctx.createLinearGradient(0, 440, 0, 720); v.addColorStop(0, 'rgba(12,11,26,0)'); v.addColorStop(0.4, 'rgba(12,11,26,0.88)'); v.addColorStop(1, 'rgba(12,11,26,0.97)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 1280, 720);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  font(800, 26, 'Inter'); const bw = ctx.measureText(TX.after).width + 36;
  ctx.fillStyle = YEL; rr(1232 - bw, 478, bw, 44, 22); ctx.fill(); ctx.fillStyle = INK; ctx.fillText(TX.after, 1232 - 18, 509);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24;
  ctx.fillStyle = YEL; font(900, 104, 'Unbounded'); ctx.fillText(TX.big, 1236, 628);
  ctx.fillStyle = '#ffffff'; font(800, 38, 'Unbounded'); ctx.fillText(TX.sub, 1234, 684);
  ctx.restore();
  ctx.restore();
}

function divider() {
  const [x1, y1] = P1, [x2, y2] = P2;
  ctx.save(); ctx.lineCap = 'butt';
  ctx.shadowColor = HOT; ctx.shadowBlur = 30;
  ctx.strokeStyle = HOT; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(x1 + 4, y1 - 10); ctx.lineTo(x2 - 4, y2 + 10); ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = YEL; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x1 + 4, y1 - 10); ctx.lineTo(x2 - 4, y2 + 10); ctx.stroke();
  // pastille flèche au milieu
  const mx = (x1 + x2) / 2 + 10, my = 330, R = 54;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 20;
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.arc(mx, my, R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(mx, my, R, 0, Math.PI * 2); ctx.stroke();
  ctx.translate(mx, my); ctx.rotate(Math.PI / 5);
  ctx.fillStyle = INK; ctx.beginPath();
  ctx.moveTo(-26, -9); ctx.lineTo(6, -9); ctx.lineTo(6, -24); ctx.lineTo(32, 0); ctx.lineTo(6, 24); ctx.lineTo(6, 9); ctx.lineTo(-26, 9); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function renderAt() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, 1280, 720);
  sideA(); sideB(); divider();
}

S.installContract({
  duration: 1, renderAt,
  ready: Promise.all([S.loadFonts([{ family: 'Unbounded', pkg: 'unbounded', weight: 800 }, { family: 'Unbounded', pkg: 'unbounded', weight: 900 },
    { family: 'Inter', pkg: 'inter', weight: 700 }, { family: 'Inter', pkg: 'inter', weight: 800 }]), ...IDS.map(load)]),
});
</script>
</body></html>
